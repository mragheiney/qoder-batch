name: qoder-provision
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Qoder account email"
        required: true
      password:
        description: "Qoder account password"
        required: true
      proxy:
        description: "Upstream proxy http://user:pass@host:port (optional)"
        required: false
        default: ""
jobs:
  provision:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qoder App
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.qoder.com/qoder-app/releases/0.5.17/Qoder-win-x64-user.exe" -OutFile qoder-setup.exe
          Start-Process .\qoder-setup.exe -ArgumentList "/S" -Wait
          Start-Sleep 5
      - name: Install python deps
        shell: pwsh
        run: pip install websocket-client pillow captcha-recognizer requests pproxy
      - name: Setup proxy and launch App
        shell: pwsh
        env:
          PROXY_UP: ${{ inputs.proxy }}
        run: |
          if ($env:PROXY_UP) {
            Start-Process python -ArgumentList "-m","pproxy","-l","http://127.0.0.1:3128","-r","$env:PROXY_UP","--quiet" -WindowStyle Hidden
            Start-Sleep 6
            Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings" -Name ProxyEnable -Value 1
            Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings" -Name ProxyServer -Value "127.0.0.1:3128"
            Write-Host "system proxy set to 127.0.0.1:3128"
            try { $ip = (Invoke-WebRequest "http://api.ipify.org" -Proxy "http://127.0.0.1:3128" -UseBasicParsing -TimeoutSec 40).Content; Write-Host "proxied exit IP: $ip" } catch { Write-Host "ip check failed: $_" }
          }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs\Qoder\Qoder.exe", "$env:ProgramFiles\Qoder\Qoder.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles" -Recurse -Filter "Qoder.exe" -ErrorAction SilentlyContinue | Where-Object FullName -notmatch "IDE|Launch" | Select-Object -First 1).FullName }
          Write-Host "Qoder exe: $exe"
          Start-Process $exe -ArgumentList "--remote-debugging-port=9224","--disable-gpu","--remote-allow-origins=*"
          Start-Sleep 25
          try { (Invoke-WebRequest "http://127.0.0.1:9224/json/version" -UseBasicParsing -TimeoutSec 10).Content } catch { Write-Host "CDP not up: $_" }
      - name: Provision account
        shell: pwsh
        env:
          QE: ${{ inputs.email }}
          QP: ${{ inputs.password }}
          PROXY_LOCAL: ${{ inputs.proxy != '' && 'http://127.0.0.1:3128' || '' }}
        run: python provision.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provision-result
          path: |
            result.json
            app-*.png
            chrome-*.png